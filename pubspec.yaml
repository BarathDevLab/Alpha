name: alpha
description: "SafeSense — private safety signals on your device."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter

  flutter_native_splash: ^2.4.7
  cupertino_icons: ^1.0.8

  # Platform channels + permissions
  permission_handler: ^11.3.1

  # Networking
  http: ^1.2.1

  # Local persistence
  shared_preferences: ^2.3.1

  # Persistent "monitoring on" notification
  flutter_local_notifications: ^17.2.2

  # Firebase (FCM)
  firebase_core: ^3.3.0
  firebase_messaging: ^15.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/images/
